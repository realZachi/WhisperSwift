# Duplicate Code Detection workflow for WhisperSwift
# Runs jscpd to detect copy-paste code on pull requests

name: Duplicate Detection

on:
  pull_request:
    branches: [main]
    paths:
      - '**/*.swift'
      - '.jscpd.json'
      - '.github/workflows/duplicate-detection.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-duplicates:
    name: Detect Duplicate Code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install jscpd
        run: npm install -g jscpd

      - name: Create reports directory
        run: mkdir -p reports/jscpd

      - name: Run duplicate detection
        id: jscpd
        run: |
          set +e
          jscpd --config .jscpd.json . 2>&1 | tee jscpd-output.txt
          JSCPD_EXIT_CODE=${PIPESTATUS[0]}
          echo "exit_code=$JSCPD_EXIT_CODE" >> $GITHUB_OUTPUT
          set -e

          # Extract statistics for the summary
          if [ -f "reports/jscpd/jscpd-report.json" ]; then
            TOTAL_LINES=$(jq '.statistics.total.lines // 0' reports/jscpd/jscpd-report.json)
            DUPLICATED_LINES=$(jq '.statistics.total.duplicatedLines // 0' reports/jscpd/jscpd-report.json)
            PERCENTAGE=$(jq '.statistics.total.percentage // 0' reports/jscpd/jscpd-report.json)
            CLONES=$(jq '.statistics.total.clones // 0' reports/jscpd/jscpd-report.json)

            echo "total_lines=$TOTAL_LINES" >> $GITHUB_OUTPUT
            echo "duplicated_lines=$DUPLICATED_LINES" >> $GITHUB_OUTPUT
            echo "percentage=$PERCENTAGE" >> $GITHUB_OUTPUT
            echo "clones=$CLONES" >> $GITHUB_OUTPUT
          fi

      - name: Generate PR comment
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            let reportContent = '';
            const exitCode = '${{ steps.jscpd.outputs.exit_code }}';
            const totalLines = '${{ steps.jscpd.outputs.total_lines }}' || '0';
            const duplicatedLines = '${{ steps.jscpd.outputs.duplicated_lines }}' || '0';
            const percentage = '${{ steps.jscpd.outputs.percentage }}' || '0';
            const clones = '${{ steps.jscpd.outputs.clones }}' || '0';

            // Read markdown report if it exists
            const markdownPath = 'reports/jscpd/jscpd-report.md';
            if (fs.existsSync(markdownPath)) {
              reportContent = fs.readFileSync(markdownPath, 'utf8');
            }

            const status = exitCode === '0' ? ':white_check_mark: Passed' : ':warning: Duplicates Found';

            const body = `## Duplicate Code Detection Report ${status}

            | Metric | Value |
            |--------|-------|
            | Total Lines Analyzed | ${totalLines} |
            | Duplicated Lines | ${duplicatedLines} |
            | Duplication Percentage | ${percentage}% |
            | Clone Instances | ${clones} |

            **Threshold:** 5% maximum duplication allowed

            <details>
            <summary>Click to see detailed report</summary>

            ${reportContent || 'No duplicates detected or report not available.'}

            </details>

            ---
            *Generated by [jscpd](https://github.com/kucherenko/jscpd)*`;

            // Find existing comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });

            const botComment = comments.find(comment =>
              comment.user.type === 'Bot' &&
              comment.body.includes('Duplicate Code Detection Report')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jscpd-reports
          path: reports/jscpd/
          retention-days: 30

      - name: Check threshold
        if: steps.jscpd.outputs.exit_code != '0'
        run: |
          echo "::error::Code duplication exceeds the 5% threshold. Please refactor duplicate code."
          echo "See the PR comment for detailed report."
          exit 1
