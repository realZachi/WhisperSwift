# Pre-commit hooks configuration for WhisperSwift
# Install: brew install pre-commit && pre-commit install

repos:
  # SwiftLint for code quality
  - repo: https://github.com/realm/SwiftLint
    rev: 0.54.0
    hooks:
      - id: swiftlint
        args: [--strict, --config, .swiftlint.yml]

  # SwiftFormat for code formatting
  - repo: https://github.com/nicklockwood/SwiftFormat
    rev: 0.53.0
    hooks:
      - id: swiftformat
        args: [--config, .swiftformat]

  # General hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      # Large file detection
      - id: check-added-large-files
        args: ['--maxkb=1000']

      # Prevent secrets from being committed
      - id: detect-private-key

      # Trailing whitespace
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]

      # End of file fixer
      - id: end-of-file-fixer

      # Check YAML files
      - id: check-yaml

      # Check JSON files
      - id: check-json

      # Check merge conflicts
      - id: check-merge-conflict

      # Check for debugger statements
      - id: debug-statements

      # Mixed line endings
      - id: mixed-line-ending
        args: [--fix=lf]

  # Detect secrets
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.4.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']
        exclude: package-lock\.json|\.env\.example

  # Markdown lint
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.39.0
    hooks:
      - id: markdownlint
        args: [--fix]

  # Shell script linting
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.9.0.6
    hooks:
      - id: shellcheck

  # Duplicate code detection (jscpd)
  # Note: Requires jscpd to be installed globally (npm install -g jscpd)
  # This hook runs on all Swift files to detect copy-paste code
  - repo: local
    hooks:
      - id: jscpd
        name: Duplicate Code Detection (jscpd)
        entry: bash -c 'if command -v jscpd &> /dev/null; then jscpd --config .jscpd.json --reporters console --exitCode 0 .; else echo "jscpd not installed, skipping. Install with: npm install -g jscpd"; fi'
        language: system
        types: [swift]
        pass_filenames: false
        stages: [pre-commit]
        verbose: true

# Default language version
default_language_version:
  python: python3
